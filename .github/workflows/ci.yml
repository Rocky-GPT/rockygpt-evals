name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployed environment to evaluate
        required: true
        type: choice
        options: [staging, production]
        default: staging

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # The suites call deployed HTTP services and may spend real model tokens, so
  # they are not run on every push. Configure BRAIN_URL and DATA_URL secrets.
  suites:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - name: Contract and answer-quality suites
        env:
          BRAIN_URL: ${{ secrets.BRAIN_URL }}
          DATA_URL: ${{ secrets.DATA_URL }}
          STAGING_SERVICE_TOKEN: ${{ secrets.STAGING_SERVICE_TOKEN }}
        run: npm run test:all
