name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Free: checks the conversation sets' shape and the runner's own tests. The live runs ask
      # a Brain and spend model tokens, so they are never run here.
      - name: Validate the conversation sets
        run: python3 brain-reset/run.py --validate

      - name: Validate the steady ruler (open half shape and hashes of both halves)
        run: python3 steady-ruler/ruler.py validate

      - name: Runner tests (the ones that need no Brain)
        working-directory: brain-reset
        run: python3 -m unittest -v test_runner

      - name: Paired comparison tests
        working-directory: compare
        run: |
          python3 -m unittest -v test_paired
          node --test test-shared-grader.mjs
