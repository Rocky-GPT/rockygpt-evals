name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # The suites call deployed HTTP services and may spend real model tokens, so
  # they are not run on every push. Configure BRAIN_URL and DATA_URL secrets.
  suites:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - name: Grounding
        env:
          BRAIN_URL: ${{ secrets.BRAIN_URL }}
          DATA_URL: ${{ secrets.DATA_URL }}
        run: npm run test:grounding
