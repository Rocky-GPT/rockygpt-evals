# Old vs new Brain on the same questions, graded the same way (tool review, 2026-11-18).
# How to run: README.md in this folder. Every setting that changes per run comes from the
# environment, so this file never changes between runs.
description: RockyGPT old vs new

providers:
  - id: http
    label: old
    config: &brain
      url: '{{ env.OLD_BRAIN_URL }}/v1/chat'
      method: POST
      headers:
        Content-Type: application/json
      body:
        messages:
          - role: user
            content: '{{ question }}'
      transformResponse: file://brain-response.mjs
  - id: http
    label: new
    config:
      <<: *brain
      url: '{{ env.NEW_BRAIN_URL }}/v1/chat'

prompts:
  - '{{ question }}'

tests: file://load-set.mjs

defaultTest:
  options:
    # The same Luna verdict for both sides when their full grader inputs match.
    provider: file://shared-grader.mjs
  # The rubric (rubric.txt, with each question's key filled in) comes with each test from
  # load-set.mjs.

evaluateOptions:
  # The Brain allows a few questions at once; two keeps a laptop or a CI runner well inside it.
  maxConcurrency: 2
